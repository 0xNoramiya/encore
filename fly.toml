# Fly.io config. Secrets are set with `fly secrets set` (see README), never here.
app = "encore-qloo"
primary_region = "syd" # next to the Supabase project (ap-southeast-2)

[build]

[env]
  QLOO_BASE_URL = "https://hackathon.api.qloo.com"
  LLM_MODEL = "claude-sonnet-5-5"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1 # judges should never hit a cold start

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
